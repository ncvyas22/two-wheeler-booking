services:
  mysql-db:
    image: mysql:8.0
    container_name: compose-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - compose-mysql-data:/var/lib/mysql
    networks:
      - compose-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask-web-app:
    build: .
    image: twowheeler-compose-app:v1
    container_name: compose-flask-app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:5000"
    environment:
      DB_HOST: mysql-db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - compose-net

volumes:
  compose-mysql-data:

networks:
  compose-net:
